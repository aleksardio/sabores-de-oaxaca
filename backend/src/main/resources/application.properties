spring.application.name=Sabores de Oaxaca API
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Los perfiles que requieren migraciones deben habilitarlas explícitamente.
spring.flyway.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.servlet.multipart.max-file-size=31457280B
spring.servlet.multipart.max-request-size=32505856B
app.upload.dir=${APP_UPLOAD_DIR:}
app.upload.public-origin=${APP_UPLOAD_PUBLIC_ORIGIN:}
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recuperacion.remitente=${RECUPERACION_REMITENTE:}
app.recuperacion.habilitada=${RECUPERACION_HABILITADA:false}
app.recuperacion.proxy-confiable=${RECUPERACION_PROXY_CONFIABLE:}

# Envío SMS de aviso al administrador por reporte creado (apagado por defecto).
app.sms.habilitado=${SMS_HABILITADO:false}
app.sms.modo-prueba=${SMS_MODO_PRUEBA:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_SMS_FROM:}
app.sms.destino=${SMS_DESTINO:}
app.sms.intervalo-segundos=${SMS_INTERVALO_SEGUNDOS:300}
